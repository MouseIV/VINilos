<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinylMarket - Inicio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container" style="text-align: center;">
  <h1>📀 VinylMarket</h1>
  <h3>Tu tienda de vinilos de confianza</h3>
  
  <div class="button-group">
    <a href="dashboard.html" class="btn">Explorar tienda</a>
    <a href="login.html" class="btn btn-secondary">Mi cuenta</a>
  </div>
  
  <div class="preview-vinilos">
    <h4>⭐ Vinilos destacados</h4>
    <div class="preview-grid" id="destacadosGrid"></div>
  </div>
</div>

<script>
  const vinilosDestacados = [
    {
      titulo: "Abbey Road",
      artista: "The Beatles",
      anio: 1969,
      genero: "Rock",
      imagenUrl: "https://upload.wikimedia.org/wikipedia/en/4/42/Beatles_-_Abbey_Road.jpg",
      precio: 29.99
    },
    {
      titulo: "Thriller",
      artista: "Michael Jackson",
      anio: 1982,
      genero: "Pop",
      imagenUrl: "https://upload.wikimedia.org/wikipedia/en/5/55/Michael_Jackson_-_Thriller.png",
      precio: 24.99
    },
    {
      titulo: "Dark Side of the Moon",
      artista: "Pink Floyd",
      anio: 1973,
      genero: "Rock Progresivo",
      imagenUrl: "https://upload.wikimedia.org/wikipedia/en/3/3b/Dark_Side_of_the_Moon.png",
      precio: 34.99
    },
    {
      titulo: "Back in Black",
      artista: "AC/DC",
      anio: 1980,
      genero: "Hard Rock",
      imagenUrl: "https://upload.wikimedia.org/wikipedia/commons/9/92/Acdc_backinblack_cover.jpg",
      precio: 27.99
    }
  ];

  const grid = document.getElementById('destacadosGrid');
  if (grid) {
    grid.innerHTML = vinilosDestacados.map(vinilo => `
      <div class="preview-card" onclick="window.location.href='dashboard.html?buscar=${encodeURIComponent(vinilo.artista)}'">
        <div class="preview-card-image">
          <img src="${vinilo.imagenUrl}" alt="${vinilo.titulo}" onerror="this.src='https://picsum.photos/200/200'">
        </div>
        <div class="preview-card-info">
          <h3>${vinilo.titulo}</h3>
          <p>🎤 ${vinilo.artista}</p>
          <p>📅 ${vinilo.anio}</p>
          <p>🎸 ${vinilo.genero}</p>
          <span class="precio">💰 ${vinilo.precio}€</span>
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
