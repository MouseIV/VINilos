<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinylMarket - Tienda</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER FIJO -->
<div class="navbar">
  <div class="navbar-top">
    <div class="menu-left" id="openSidebarLeft">☰</div>
    <div class="logo">🎧 VinylMarket</div>
    <div class="search-container">
      <input type="text" class="search-bar" id="searchInput" placeholder="Buscar vinilos...">
      <button class="search-btn" id="searchBtn">Buscar</button>
    </div>
    <div class="menu-right" id="openSidebarRight">👤</div>
  </div>
  <div class="navbar-bottom">
    <a href="index.html">Inicio</a>
    <a href="#">Vinilo del día</a>
    <a href="#">Novedades</a>
    <a href="perfil.html">Mi colección</a>
  </div>
</div>

<!-- OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR IZQUIERDO -->
<div class="sidebar-left" id="sidebarLeft">
  <div class="close" id="closeSidebarLeft">✖</div>
  
  <h3>🎵 Géneros</h3>
  <div id="generosList" class="generos-list">
    <div class="loading-text">Cargando géneros...</div>
  </div>
  
  <div class="buyer-section">
    <h3>🛍️ Para compradores</h3>
    <button class="sidebar-btn" id="btnMasSolicitados" data-accion="solicitados">🔥 Más solicitados</button>
    <button class="sidebar-btn" id="btnGrandesOfertas" data-accion="ofertas">💸 Grandes ofertas</button>
  </div>
  
  <div class="seller-section" style="display:none;">
    <h3>📦 Para vendedores</h3>
    <button class="sidebar-btn" id="btnTopVentas" data-accion="topventas">📈 Top ventas</button>
    <button class="sidebar-btn" id="btnNuevaPublicacion" data-accion="publicar">➕ Nueva publicación</button>
  </div>
</div>

<!-- SIDEBAR DERECHO -->
<div class="sidebar-right" id="sidebarRight">
  <div class="close" id="closeSidebarRight">✖</div>
  <h3>👤 Mi perfil</h3>
  
  <div id="profileInfo">
    <p>Inicia sesión para ver tu perfil</p>
    <button class="btn" onclick="window.location.href='login.html'">Iniciar sesión</button>
    <button class="btn btn-secondary" onclick="window.location.href='register.html'">Registrarse</button>
  </div>
  
  <div class="user-type-selector" id="userTypeSelector" style="display: none;">
    <label>🎭 Tipo de usuario:</label>
    <select id="userTypeSelect" class="user-type-select">
      <option value="comprador">🟡 Comprador</option>
      <option value="vendedor">🔵 Vendedor</option>
      <option value="ambos">🟢 Comprador y Vendedor</option>
    </select>
  </div>
  
  <button class="btn" id="miColeccionBtn" onclick="window.location.href='perfil.html'" style="display: none;">📀 Mi colección</button>
  <hr>
  <button class="btn btn-secondary" id="logoutBtn" style="display: none;">🚪 Cerrar sesión</button>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="main-content">
  <div class="daily-vinyl">
    <h3>🎲 Vinilo del día</h3>
    <p id="viniloDelDia">Cargando...</p>
  </div>

  <h2>⭐ Vinilos Destacados</h2>
  <div class="featured-wrapper">
    <button class="scroll-btn" id="scrollLeft">◀</button>
    <div class="featured-grid" id="featuredGrid"></div>
    <button class="scroll-btn" id="scrollRight">▶</button>
  </div>

  <div class="vinyl-grid" id="vinylGrid">
    <p>🔍 Busca un artista o título para empezar</p>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
