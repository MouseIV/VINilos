  <!-- ========== DESPLEGABLE PARA INFORMACIÓN ADICIONAL ========== -->
  <div class="datos-cliente-card">
    <div class="datos-cliente-header" id="toggleDatosCliente" style="cursor: pointer;">
      <h3 style="display: flex; justify-content: space-between; align-items: center; margin: 0;">
        📋 Información adicional
        <span class="toggle-icon" id="datosClienteIcon">▼</span>
      </h3>
    </div>
    <div id="datosClienteContenido" class="datos-cliente-contenido">
      <div class="datos-cliente-form">
        
        <!-- GRID: Fila 1 - Apellido y Ciudad -->
        <div class="form-grid">
          <div class="input-group">
            <label>👤 Apellido</label>
            <input type="text" id="apellido" placeholder="Tu apellido">
          </div>
          <div class="input-group">
            <label>📍 Ciudad</label>
            <input type="text" id="ciudad" placeholder="Tu ciudad">
          </div>
        </div>
        
        <!-- GRID: Fila 2 - Prefijo (pequeño), Teléfono, Código Postal -->
        <div class="form-grid form-grid-3cols">
          <div class="input-group prefijo-group">
            <label>📞 Prefijo</label>
            <input type="text" id="prefijo" placeholder="+34" maxlength="3" value="+34">
          </div>
          <div class="input-group telefono-group">
            <label>📞 Teléfono</label>
            <input type="tel" id="telefono" placeholder="123456789" maxlength="9" pattern="[0-9]{9}" inputmode="numeric">
          </div>
          <div class="input-group cp-group">
            <label>📮 Código Postal</label>
            <input type="text" id="codigoPostal" placeholder="12345" maxlength="5" pattern="[0-9]{5}" inputmode="numeric">
          </div>
        </div>
        
        <!-- GRID: Fila 3 - Dirección y Tipo de coleccionista -->
        <div class="form-grid">
          <div class="input-group">
            <label>🏠 Dirección</label>
            <input type="text" id="direccion" placeholder="Tu dirección">
          </div>
          <div class="input-group">
            <label>🎯 Tipo de coleccionista</label>
            <select id="tipoColeccionista">
              <option value="principiante">Principiante (1-10 vinilos)</option>
              <option value="aficionado">Aficionado (11-50 vinilos)</option>
              <option value="coleccionista">Coleccionista (51-200 vinilos)</option>
              <option value="experto">Experto (más de 200 vinilos)</option>
            </select>
          </div>
        </div>
        
        <div class="form-actions">
          <button id="guardarDatosClienteBtn" class="btn">💾 Guardar información</button>
          <button id="cargarDatosClienteBtn" class="btn btn-secondary">🔄 Recargar datos</button>
        </div>
      </div>
    </div>
  </div>
