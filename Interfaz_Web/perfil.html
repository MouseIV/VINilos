<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - VinylMarket</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="perfil-page">

<!-- NAVBAR -->
<div class="navbar">
  <div class="navbar-top">
    <div class="logo">🎧 VinylMarket</div>
    <div class="menu-right" id="openSidebarRight">👤</div>
  </div>
  <div class="navbar-bottom">
    <a href="dashboard.html">Tienda</a>
    <a href="index.html">Inicio</a>
  </div>
</div>

<!-- OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- CONTENIDO PRINCIPAL -->
<div class="main-content" style="margin-top: 100px; max-width: 1000px; margin-left: auto; margin-right: auto;">
  
  <!-- ========== PERFIL CARD ========== -->
  <div class="perfil-card">
    <h2>👤 Mi Perfil</h2>
    <div class="perfil-info-grid" id="perfilInfo">
      <!-- Los datos se cargarán dinámicamente con JavaScript -->
    </div>
    <div class="perfil-actions">
      <button id="logoutBtn" class="btn btn-secondary" style="width: auto; padding: 8px 20px;">🚪 Cerrar sesión</button>
    </div>
  </div>

  <!-- ========== DESPLEGABLE PARA INFORMACIÓN ADICIONAL ========== -->
  <div class="datos-cliente-card">
    <div class="datos-cliente-header" id="toggleDatosCliente" style="cursor: pointer;">
      <h3 style="display: flex; justify-content: space-between; align-items: center; margin: 0;">
        📋 Información adicional
        <span class="toggle-icon" id="datosClienteIcon">▶</span>
      </h3>
    </div>
    <div id="datosClienteContenido" class="datos-cliente-contenido collapsed">
      <div class="datos-cliente-form">
        
        <!-- Fila 1: Apellido y Ciudad -->
        <div class="form-row">
          <div class="form-field">
            <label>👤 Apellido</label>
            <input type="text" id="apellido" placeholder="Ej: García">
          </div>
          <div class="form-field">
            <label>📍 Ciudad</label>
            <input type="text" id="ciudad" placeholder="Ej: Madrid">
          </div>
        </div>
        
        <!-- Fila 2: Dirección (ancho completo) -->
        <div class="form-row">
          <div class="form-field full-width">
            <label>🏠 Dirección</label>
            <input type="text" id="direccion" placeholder="Ej: Calle Mayor 123">
          </div>
        </div>
        
        <!-- Fila 3: Prefijo, Teléfono y Código Postal -->
        <div class="form-row">
          <div class="form-field prefijo-field">
            <label>📞 Prefijo</label>
            <input type="text" id="prefijo" placeholder="+34" maxlength="3" value="+34">
          </div>
          <div class="form-field telefono-field">
            <label>📞 Teléfono</label>
            <input type="tel" id="telefono" placeholder="123456789" maxlength="9">
          </div>
          <div class="form-field cp-field">
            <label>📮 Código Postal</label>
            <input type="text" id="codigoPostal" placeholder="12345" maxlength="5">
          </div>
        </div>
        
        <!-- Fila 4: Tipo de coleccionista (ancho completo) -->
        <div class="form-row">
          <div class="form-field full-width">
            <label>🎯 Tipo de coleccionista</label>
            <select id="tipoColeccionista">
              <option value="principiante">📀 Principiante (1-10 vinilos)</option>
              <option value="aficionado">🎵 Aficionado (11-50 vinilos)</option>
              <option value="coleccionista">🎶 Coleccionista (51-200 vinilos)</option>
              <option value="experto">🏆 Experto (más de 200 vinilos)</option>
            </select>
          </div>
        </div>
        
        <!-- Botones -->
        <div class="form-buttons">
          <button id="guardarDatosClienteBtn" class="btn btn-primary">💾 Guardar información</button>
          <button id="cargarDatosClienteBtn" class="btn btn-secondary">🔄 Recargar datos</button>
        </div>
        
      </div>
    </div>
  </div>

  <!-- ========== DESPLEGABLE DE ESTADÍSTICAS ========== -->
  <div class="estadisticas-card">
    <div class="estadisticas-header" id="toggleEstadisticas" style="cursor: pointer;">
      <h3 style="display: flex; justify-content: space-between; align-items: center; margin: 0;">
        📊 Estadísticas de tu colección
        <span class="toggle-icon" id="estadisticasIcon">▶</span>
      </h3>
    </div>
    <div id="estadisticasContenido" class="estadisticas-contenido collapsed">
      <div class="estadisticas-grid" id="estadisticasColeccion">
        <p>Cargando estadísticas...</p>
      </div>
    </div>
  </div>

  <!-- ========== SECCIÓN DE COLECCIÓN (SIEMPRE VISIBLE) ========== -->
  <div class="coleccion-section">
    <h3>📀 Mi Colección</h3>
    <div id="miColeccion" class="coleccion-grid"></div>
  </div>
  
</div>

<!-- SIDEBAR DERECHO -->
<div class="sidebar-right" id="sidebarRight">
  <div class="close" id="closeSidebarRight">✖</div>
  
  <h3>👤 Mi perfil</h3>
  <div id="sidebarProfileInfo"></div>
  
  <hr>
  
  <div class="user-type-selector">
    <label>🎭 Tipo de usuario:</label>
    <select id="userTypeSelect" class="user-type-select">
      <option value="comprador">🟡 Comprador</option>
      <option value="vendedor">🔵 Vendedor</option>
      <option value="ambos">🟢 Comprador y Vendedor</option>
    </select>
  </div>
  
  <hr>
  
  <h3>➕ Añadir vinilo</h3>
  <div class="agregar-vinilo">
    <div class="input-group">
      <label>🎵 Título *</label>
      <input type="text" id="nuevoTitulo" placeholder="Ej: Dark Side of the Moon">
    </div>
    <div class="input-group">
      <label>🎤 Artista *</label>
      <input type="text" id="nuevoArtista" placeholder="Ej: Pink Floyd">
    </div>
    <div class="input-group">
      <label>📅 Año</label>
      <input type="number" id="nuevoAnio" placeholder="Ej: 1973">
    </div>
    <div class="input-group">
      <label>🎸 Género</label>
      <input type="text" id="nuevoGenero" placeholder="Ej: Rock">
    </div>
    <div class="input-group">
      <label>🖼️ URL imagen</label>
      <input type="text" id="nuevaImagen" placeholder="https://...">
    </div>
    
    <h4>📀 Datos del ejemplar</h4>
    <div class="input-group">
      <label>💿 Estado</label>
      <select id="estadoVinilo">
        <option value="NUEVO">🟢 Nuevo</option>
        <option value="MUY_BUENO">🟡 Muy bueno</option>
        <option value="BUENO">🟠 Bueno</option>
        <option value="REGULAR">🔴 Regular</option>
      </select>
    </div>
    <div class="input-group">
      <label>⭐ Calificación</label>
      <div class="rating-stars" id="ratingStarsNew">
        <span data-valor="1">☆</span>
        <span data-valor="2">☆</span>
        <span data-valor="3">☆</span>
        <span data-valor="4">☆</span>
        <span data-valor="5">☆</span>
      </div>
      <input type="hidden" id="calificacionNueva" value="5">
    </div>
    <button id="btnAgregarVinilo" class="btn">➕ Añadir a colección</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/notifications.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/perfil.js"></script>

</body>
</html>
